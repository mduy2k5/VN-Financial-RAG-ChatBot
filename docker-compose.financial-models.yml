# Optional local inference runtime. Use together with the standalone compose.
# Reuses the existing model volume; models must already be present.
services:
  financial-rag:
    environment:
      - OLLAMA_URL=http://financial-models:11434
      - FINANCIAL_EMBEDDING_URL=http://financial-models:11434
    depends_on:
      financial-models:
        condition: service_healthy

  financial-rag-worker:
    environment:
      - OLLAMA_URL=http://financial-models:11434
      - FINANCIAL_EMBEDDING_URL=http://financial-models:11434
    depends_on:
      financial-models:
        condition: service_healthy

  financial-models:
    image: ollama/ollama:latest
    cpus: 4.0
    mem_limit: 2048m
    memswap_limit: 2048m
    container_name: financial-rag-models-standalone
    networks:
      - financial-rag-network
    ports:
      - "127.0.0.1:${FINANCIAL_MODELS_HOST_PORT:-11434}:11434"
    environment:
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_MAX_LOADED_MODELS=1
    volumes:
      - financial-rag-models:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped

volumes:
  financial-rag-models:
    external: true
    name: ${FINANCIAL_MODELS_VOLUME:-ollama_ollama_data}
