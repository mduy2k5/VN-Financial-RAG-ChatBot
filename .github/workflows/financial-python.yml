name: Financial Python checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  financial-python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: financial_python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: financial_python/pyproject.toml
      - name: Install package and development tools
        run: python -m pip install -e ".[dev]"
      - name: Run test suite
        run: python -m pytest -q
      - name: Run Ruff
        run: python -m ruff check .
      - name: Run mypy
        run: python -m mypy src
