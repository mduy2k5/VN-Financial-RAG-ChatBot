name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Python 3.11 / Node 24
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan Git history for secrets
        run: |
          docker run --rm --network=none \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/repo,readonly" \
            ghcr.io/gitleaks/gitleaks:v8.30.0 \
            git --config=/repo/.gitleaks.toml --redact --no-banner --log-opts=--all /repo

      - name: Scan checked-out files for secrets
        run: |
          docker run --rm --network=none \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/repo,readonly" \
            ghcr.io/gitleaks/gitleaks:v8.30.0 \
            dir --config=/repo/.gitleaks.toml --redact --no-banner /repo

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: financial_python/pyproject.toml

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install Python package and development tools
        working-directory: financial_python
        run: python -m pip install -e ".[dev]"

      - name: Run tests
        working-directory: financial_python
        run: python -m pytest -q

      - name: Lint Python
        working-directory: financial_python
        run: python -m ruff check .

      - name: Check Python types
        working-directory: financial_python
        run: python -m mypy src

      - name: Check JavaScript syntax
        shell: bash
        run: |
          while IFS= read -r file; do
            node --check "$file"
          done < <(git ls-files '*.js')

      - name: Validate Docker Compose configuration
        run: docker compose -f docker-compose.financial-standalone.yml config --quiet
