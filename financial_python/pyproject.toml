[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vn-financial-understanding"
version = "0.1.0"
description = "Financial RAG service for Vietnamese financial reports"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110.0",
  "uvicorn>=0.28.0",
  "pydantic>=2.6.0",
  "requests>=2.31.0",
  "rank-bm25>=0.2.2",
  "numpy>=1.26.0",
  "orjson>=3.9.0",
  "python-multipart>=0.0.9",
  "pymongo>=4.10,<5",
  "qdrant-client>=1.14,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "httpx>=0.27.0",
  "httpx2>=2.0.0",
  "ruff>=0.6.0",
  "mypy>=1.11.0",
]
[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
