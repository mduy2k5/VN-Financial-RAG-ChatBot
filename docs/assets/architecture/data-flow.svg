<svg xmlns="http://www.w3.org/2000/svg" width="2700" height="1500" viewBox="0 0 2700 1500" role="img" aria-labelledby="title desc">
<title id="title">Luồng xử lý dữ liệu từ TXT đến câu trả lời</title>
<desc id="desc">Sơ đồ minh họa quá trình nạp báo cáo TXT, tạo chỉ mục, tìm bằng chứng theo câu hỏi, kiểm tra số liệu và trả lời người dùng kèm trích dẫn.</desc>
<defs>
  <marker id="arrow-blue" viewBox="0 0 18 18" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M2 2L15 9L2 16Z" fill="#438fe3"/></marker>
  <marker id="arrow-violet" viewBox="0 0 18 18" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M2 2L15 9L2 16Z" fill="#8760d3"/></marker>
  <marker id="arrow-teal" viewBox="0 0 18 18" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M2 2L15 9L2 16Z" fill="#17a99b"/></marker>
  <style>
    text{font-family:Inter,"Segoe UI",Arial,sans-serif}
    .title{font-size:68px;font-weight:800;fill:#172438;letter-spacing:.6px}
    .subtitle{font-size:31px;font-weight:500;fill:#63748b}
    .section{font-size:34px;font-weight:800;fill:#172438;letter-spacing:.3px}
    .section-note{font-size:23px;font-weight:500;fill:#708198}
    .card-title{font-size:27px;font-weight:750;fill:#172438}
    .card-copy{font-size:22px;font-weight:450;fill:#617187}
    .step{font-size:19px;font-weight:800;fill:#438fe3}
    .qstep{font-size:19px;font-weight:800;fill:#8760d3}
    .footer{font-size:24px;font-weight:650;fill:#43536a}
    .icon{fill:none;stroke:#438fe3;stroke-width:5.2;stroke-linecap:round;stroke-linejoin:round}
    .qicon{fill:none;stroke:#8760d3;stroke-width:5.2;stroke-linecap:round;stroke-linejoin:round}
    .dbicon{fill:none;stroke:#17a99b;stroke-width:5.2;stroke-linecap:round;stroke-linejoin:round}
  </style>
</defs>

<rect width="2700" height="1500" fill="#f5f7fb"/>
<circle cx="110" cy="112" r="40" fill="#e7f1ff"/>
<path d="M91 108h38M91 120h28M99 95h22v38H99z" class="icon"/>
<text x="175" y="117" class="title">LUỒNG XỬ LÝ DỮ LIỆU</text>
<text x="178" y="172" class="subtitle">Từ báo cáo TXT đến câu trả lời có số liệu và trích dẫn nguồn</text>
<rect x="2092" y="74" width="475" height="98" rx="24" fill="#fff" stroke="#dfe6ef" stroke-width="2"/>
<path d="M2126 108h68" stroke="#438fe3" stroke-width="8" stroke-linecap="round" marker-end="url(#arrow-blue)"/>
<text x="2212" y="116" font-size="21" font-weight="650" fill="#617187">Nạp tài liệu</text>
<path d="M2126 143h68" stroke="#8760d3" stroke-width="8" stroke-linecap="round" marker-end="url(#arrow-violet)"/>
<text x="2212" y="151" font-size="21" font-weight="650" fill="#617187">Hỏi đáp</text>

<!-- Lane 1: ingest and index -->
<rect x="55" y="220" width="2590" height="455" rx="30" fill="#edf5ff" stroke="#d9e7f7" stroke-width="2"/>
<circle cx="110" cy="289" r="29" fill="#dcecff"/>
<text x="110" y="298" text-anchor="middle" font-size="22" font-weight="850" fill="#438fe3">01</text>
<text x="158" y="300" class="section">NẠP TÀI LIỆU &amp; LẬP CHỈ MỤC</text>
<text x="715" y="298" class="section-note">Thực hiện khi thêm báo cáo; dữ liệu sẵn sàng sau khi ingestion hoàn tất</text>

<!-- ingest arrows -->
<path d="M435 500H493" fill="none" stroke="#438fe3" stroke-width="8" stroke-linecap="round" marker-end="url(#arrow-blue)"/>
<path d="M845 500H903" fill="none" stroke="#438fe3" stroke-width="8" stroke-linecap="round" marker-end="url(#arrow-blue)"/>
<path d="M1255 500H1313" fill="none" stroke="#438fe3" stroke-width="8" stroke-linecap="round" marker-end="url(#arrow-blue)"/>
<path d="M1665 500H1723" fill="none" stroke="#438fe3" stroke-width="8" stroke-linecap="round" marker-end="url(#arrow-blue)"/>
<path d="M2075 500H2133" fill="none" stroke="#438fe3" stroke-width="8" stroke-linecap="round" marker-end="url(#arrow-blue)"/>

<!-- ingest card 1 -->
