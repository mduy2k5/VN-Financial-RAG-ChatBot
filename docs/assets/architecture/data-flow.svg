<text x="948" y="548" class="card-copy"><tspan x="948">Tách đoạn văn, bảng</tspan><tspan x="948" dy="32">và dòng chỉ tiêu</tspan></text>

<!-- ingest card 4 -->
<rect x="1325" y="365" width="340" height="270" rx="24" fill="#fff" stroke="#cfe0f3" stroke-width="2.5"/>
<circle cx="1375" cy="410" r="21" fill="#eaf3ff"/><text x="1375" y="417" class="step" text-anchor="middle">4</text>
