<text x="1480" y="472" class="card-title">Chuẩn hóa</text>
<text x="1358" y="548" class="card-copy"><tspan x="1358">Gắn metadata, chia chunk</tspan><tspan x="1358" dy="32">và giữ vị trí nguồn</tspan></text>

<!-- ingest card 5 -->
<rect x="1735" y="365" width="340" height="270" rx="24" fill="#fff" stroke="#cfe0f3" stroke-width="2.5"/>
<circle cx="1785" cy="410" r="21" fill="#eaf3ff"/><text x="1785" y="417" class="step" text-anchor="middle">5</text>
<ellipse cx="1850" cy="460" rx="30" ry="11" class="dbicon"/><path d="M1820 460v42c0 7 13 12 30 12s30-5 30-12v-42M1820 480c0 7 13 12 30 12s30-5 30-12" class="dbicon"/>
<text x="1900" y="472" class="card-title">MongoDB</text>
<text x="1768" y="548" class="card-copy"><tspan x="1768">Lưu văn bản gốc,</tspan><tspan x="1768" dy="32">chunks và metadata</tspan></text>

<!-- ingest card 6 -->
<rect x="2145" y="365" width="340" height="270" rx="24" fill="#fff" stroke="#cfe0f3" stroke-width="2.5"/>
<circle cx="2195" cy="410" r="21" fill="#eaf3ff"/><text x="2195" y="417" class="step" text-anchor="middle">6</text>
<circle cx="2263" cy="479" r="26" class="icon"/><path d="M2283 499l20 20M2248 479h30M2263 464v30" class="icon"/>
<text x="2315" y="472" class="card-title" font-size="25">Chỉ mục tìm kiếm</text>
<text x="2178" y="548" class="card-copy"><tspan x="2178">BM25 trong RAM</tspan><tspan x="2178" dy="32">E5 → Qdrant nếu bật</tspan></text>

<!-- published index to query retrieval -->
<path d="M2315 635V724H1512V884" fill="none" stroke="#17a99b" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/>
<rect x="1760" y="688" width="340" height="48" rx="22" fill="#e3f6f2"/>
<text x="1930" y="720" text-anchor="middle" font-size="21" font-weight="750" fill="#198577">CHỈ MỤC ĐÃ SẴN SÀNG</text>

<!-- Lane 2: query and answer -->
<rect x="55" y="770" width="2590" height="515" rx="30" fill="#f3effb" stroke="#e2d8f0" stroke-width="2"/>
<circle cx="110" cy="832" r="29" fill="#e8def8"/>
<text x="110" y="841" text-anchor="middle" font-size="22" font-weight="850" fill="#8760d3">02</text>
<text x="158" y="844" class="section">TÌM BẰNG CHỨNG &amp; TRẢ LỜI</text>
<text x="765" y="842" class="section-note">Lặp lại mỗi lượt hỏi; phạm vi câu hỏi quyết định đoạn nguồn được dùng</text>

<!-- query arrows -->
