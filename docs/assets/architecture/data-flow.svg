<text x="2353" y="1113" class="card-copy"><tspan x="2353">Câu trả lời, nguồn</tspan><tspan x="2353" dy="30">và trích đoạn liên quan</tspan></text>

<!-- footer -->
<rect x="95" y="1320" width="2510" height="105" rx="24" fill="#fff" stroke="#dfe6ef" stroke-width="2"/>
<circle cx="147" cy="1372" r="20" fill="#e3f6f2"/>
<path d="M138 1372l7 7 13-15" fill="none" stroke="#17a99b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
