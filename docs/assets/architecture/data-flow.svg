<text x="403" y="1071" class="card-title" font-size="25">API tiếp nhận</text>
<text x="403" y="1113" class="card-copy"><tspan x="403">FastAPI nhận câu hỏi</tspan><tspan x="403" dy="30">và phiên chat</tspan></text>

