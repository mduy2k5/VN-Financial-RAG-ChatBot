<text x="205" y="472" class="card-title">Báo cáo .TXT</text>
<text x="128" y="548" class="card-copy"><tspan x="128">Nội dung tài chính</tspan><tspan x="128" dy="32">được tải lên hệ thống</tspan></text>

<!-- ingest card 2 -->
<rect x="505" y="365" width="340" height="270" rx="24" fill="#fff" stroke="#cfe0f3" stroke-width="2.5"/>
<circle cx="555" cy="410" r="21" fill="#eaf3ff"/><text x="555" y="417" class="step" text-anchor="middle">2</text>
<path d="M622 454v47M604 473l18-19 18 19M590 492v18q0 8 8 8h48q8 0 8-8v-18" class="icon"/>
<text x="680" y="472" class="card-title">Tiếp nhận</text>
<text x="538" y="548" class="card-copy"><tspan x="538">API kiểm tra tệp</tspan><tspan x="538" dy="32">và ghi nhận tài liệu</tspan></text>

<!-- ingest card 3 -->
<rect x="915" y="365" width="340" height="270" rx="24" fill="#fff" stroke="#cfe0f3" stroke-width="2.5"/>
<circle cx="965" cy="410" r="21" fill="#eaf3ff"/><text x="965" y="417" class="step" text-anchor="middle">3</text>
<path d="M1000 455h59v18h-59zM1000 483h59v18h-59zM1012 464h21M1012 492h34M1029 473v10" class="icon"/>
