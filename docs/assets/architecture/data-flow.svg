<text x="1378" y="1113" class="card-copy"><tspan x="1378">BM25 · E5 tùy chọn</tspan><tspan x="1378" dy="30">hợp nhất thứ hạng</tspan></text>

<!-- query card 6 -->
<rect x="1685" y="900" width="295" height="290" rx="24" fill="#fff" stroke="#dfd4ef" stroke-width="2.5"/>
<circle cx="1730" cy="941" r="20" fill="#f0eafd"/><text x="1730" y="948" class="qstep" text-anchor="middle">6</text>
<path d="M1768 953h55l14 14v51h-69zM1823 953v16h14M1781 984h42M1781 997h27" class="qicon"/><circle cx="1831" cy="1017" r="14" fill="#fff" stroke="#17a99b" stroke-width="4"/><text x="1831" y="1024" text-anchor="middle" font-size="18" font-weight="800" fill="#17a99b">c</text>
