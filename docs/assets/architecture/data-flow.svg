<path d="M1980 1035H2012" fill="none" stroke="#8760d3" stroke-width="8" stroke-linecap="round" marker-end="url(#arrow-violet)"/>
<path d="M2305 1035H2337" fill="none" stroke="#8760d3" stroke-width="8" stroke-linecap="round" marker-end="url(#arrow-violet)"/>

<!-- query card 1 -->
<rect x="60" y="900" width="295" height="290" rx="24" fill="#fff" stroke="#dfd4ef" stroke-width="2.5"/>
<circle cx="105" cy="941" r="20" fill="#f0eafd"/><text x="105" y="948" class="qstep" text-anchor="middle">1</text>
<path d="M105 982a17 17 0 1 0 0-34 17 17 0 0 0 0 34M77 1021c3-16 14-24 28-24s25 8 28 24M125 1000h37q7 0 7 7v20q0 7-7 7h-20l-12 10v-10h-5" class="qicon"/>
<text x="78" y="1071" class="card-title" font-size="25">Câu hỏi</text>
<text x="78" y="1113" class="card-copy"><tspan x="78">“Tổng tài sản MBB</tspan><tspan x="78" dy="30">năm 2025 là bao nhiêu?”</tspan></text>

<!-- query card 2 -->
<rect x="385" y="900" width="295" height="290" rx="24" fill="#fff" stroke="#dfd4ef" stroke-width="2.5"/>
